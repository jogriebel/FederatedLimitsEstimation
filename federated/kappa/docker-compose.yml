version: "3.8"

services:
  server:
    build: ../..
    command: python federated/kappa/server.py
      --server_address 0.0.0.0:8095
      --num_clients 5
      --n_seeds 20
      --oversample 1
    ports:
      - "8095:8095"
    volumes:
      - ../../FLdata:/app/FLdata
      - ../../FLresults:/app/FLresults

  client1:
    build: ../..
    command: python federated/kappa/client.py --server_address server:8095 --client_id 1
    depends_on: [server]
    volumes:
      - ../../FLdata:/app/FLdata

  client2:
    build: ../..
    command: python federated/kappa/client.py --server_address server:8095 --client_id 2
    depends_on: [server]
    volumes:
      - ../../FLdata:/app/FLdata

  client3:
    build: ../..
    command: python federated/kappa/client.py --server_address server:8095 --client_id 3
    depends_on: [server]
    volumes:
      - ../../FLdata:/app/FLdata

  client4:
    build: ../..
    command: python federated/kappa/client.py --server_address server:8095 --client_id 4
    depends_on: [server]
    volumes:
      - ../../FLdata:/app/FLdata

  client5:
    build: ../..
    command: python federated/kappa/client.py --server_address server:8095 --client_id 5
    depends_on: [server]
    volumes:
      - ../../FLdata:/app/FLdata
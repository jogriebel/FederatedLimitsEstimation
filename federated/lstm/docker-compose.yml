version: "3.8"

services:
  server:
    build: ../..
    command: python federated/lstm/server.py --server_address 0.0.0.0:8097
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports: ["8097:8097"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-limits:5000
    volumes:
      - ../../FLdata:/app/FLdata
      - ../../FLresults:/app/FLresults
      - ../../FLhyperparams:/app/FLhyperparams
    networks:
      - default
      - mlflow-limits-net
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    


  client1:
    build: ../..
    command: python federated/lstm/client.py --server_address server:8097 --client_id 1
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on: [server]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-limits:5000
    volumes:
      - ../../FLdata:/app/FLdata
      - ../../FLresults:/app/FLresults
      - ../../FLhyperparams:/app/FLhyperparams
    networks:
      - default
      - mlflow-limits-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "3g"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  client2:
